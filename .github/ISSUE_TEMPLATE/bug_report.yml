name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal snippet. Which path — SDK, gateway (stdio/http), or the Claude Code plugin?
      placeholder: |
        1. new Winnow({ ... })
        2. await client.searchTools("...")
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or a commit SHA"
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "Node version, OS, which upstream MCP servers"
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
